spring.application.name=eventPro
#spring.datasource.url=jdbc:postgresql://localhost:5432/eventPro
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/eventpro}
spring.datasource.username=postgres
spring.datasource.password=12345678
spring.datasource.driver-class-name=org.postgresql.Driver
# Gestion automatique du schéma par Hibernate (update, create, validate, etc.)
spring.jpa.hibernate.ddl-auto=update
# Afficher les requêtes SQL dans la console (optionnel)
#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true

app.reservation.hold-minutes=10
   # date de l'experation de reservation

server.servlet.session.persistent=false
   #

app.reservation.expiration-check-ms= 30000
   # date entre l'execution de methode scheduled

app.event.cancellation-check-ms=10000


# actuator
# Exposer les endpoints Actuator
management.endpoints.web.exposure.include=health,info,metrics

# Afficher les détails de santé
management.endpoint.health.show-details=never

# Informations de l'application
management.info.env.enabled=true
info.app.name=eventPro
info.app.description=Application de gestion des événements
info.app.version=1.0.0
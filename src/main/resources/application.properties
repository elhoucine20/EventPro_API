spring.application.name=eventPro
spring.datasource.url=jdbc:postgresql://localhost:5432/eventPro
spring.datasource.username=postgres
spring.datasource.password=12345678
spring.datasource.driver-class-name=org.postgresql.Driver
# Gestion automatique du schéma par Hibernate (update, create, validate, etc.)
spring.jpa.hibernate.ddl-auto=update
# Afficher les requêtes SQL dans la console (optionnel)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


app.reservation.hold-minutes=15

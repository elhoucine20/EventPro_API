--- Base de données ---
spring.datasource.url=jdbc:h2:mem:eventpro;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
"SET lock_timeout" n'existe pas en H2 : on le remplace par une requête neutre
spring.datasource.hikari.connection-init-sql=SELECT 1

--- JPA : les tables sont créées au démarrage et supprimées à l'arrêt ---
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

--- Compte administrateur de test (jamais le vrai compte) ---
eventPro.admin.name=Admin Test
eventPro.admin.email=admin.test@eventpro.local
eventPro.admin.password=Test-only-password-1

--- Réservation ---
eventpro.reservation.hold-duration=PT10M
Le planificateur d'expiration ne doit pas tourner pendant les tests (1 passage par heure)
eventpro.reservation.expiration-scan-interval=3600000

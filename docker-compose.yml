name: eventpro

services:

  # service de registery relation avec dickerlisation
  registry:
    image: registry:2
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"          # visible depuis ta machine seulement
    volumes:
      - registry_data:/var/lib/registry


  db:
    image: postgres:17-alpine            # le cahier des charges demande PostgreSQL 15+
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eventpro}
      POSTGRES_USER: ${POSTGRES_USER:-eventpro}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant, copie .env.example vers .env}"
    volumes:
      - eventpro_db:/var/lib/postgresql/data     # les données survivent aux redémarrages et aux rebuilds
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5433}:5432"   # visible depuis ta machine seulement (pgAdmin), jamais depuis Internet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  app:
    build:
      context: .
    image: eventpro-api:${APP_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy       # l'application ne démarre que lorsque la base répond
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-eventpro}
      DB_USERNAME: ${POSTGRES_USER:-eventpro}
      DB_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant}"
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
    ports:
      - "${APP_PORT:-8080}:8080"         # derrière un reverse proxy HTTPS : "127.0.0.1:8080:8080"
    read_only: true                      # le système de fichiers du conteneur est en lecture seule...
    tmpfs:
      - /tmp                             # ...sauf /tmp (en mémoire), dont Tomcat a besoin
    cap_drop:
      - ALL                              # aucune capacité Linux spéciale
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 40s               # laisse finir les requêtes en cours (arrêt propre de Spring : 30 s)
    deploy:
      resources:
        limits:
          memory: 768m                   # tas Java = 75 % de cette valeur
          cpus: "1.0"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  jenkins:
    build: ./ci_cd/jenkins
    image: eventpro-jenkins:lts-jdk21
    container_name: jenkins
    restart: unless-stopped
    user: root                       # voir la note de sécurité ci-dessous
    ports:
      - "9090:8080"                  # interface web
      - "50000:50000"                # agents distants
    volumes:
      - jenkins_home:/var/jenkins_home          # configuration, historique, cache Maven
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      TZ: Africa/Casablanca
      JAVA_OPTS: "-Duser.timezone=Africa/Casablanca"

  ngrok:
    image: ngrok/ngrok:latest
    container_name: eventpro-ngrok
    restart: unless-stopped
    command: http jenkins:9090
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    depends_on:
      - jenkins

  sonarqube-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sonarqube
      POSTGRES_USER: sonarqube
      POSTGRES_PASSWORD: "${SONAR_DB_PASSWORD:?SONAR_DB_PASSWORD manquant dans ci/.env}"
    volumes:
      - sonarqube_db:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U sonarqube -d sonarqube" ]
      interval: 10s
      timeout: 5s
      retries: 5

  sonarqube:
    image: sonarqube:community           # voir la note de version ci-dessous
    restart: unless-stopped
    depends_on:
      sonarqube-db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/sonarqube
      SONAR_JDBC_USERNAME: sonarqube
      SONAR_JDBC_PASSWORD: "${SONAR_DB_PASSWORD}"
      SONAR_VALIDATEWEBHOOKS: "false"    # autorise le webhook vers Jenkins sur le réseau Docker local
    ports:
      - "127.0.0.1:9000:9000"            # visible depuis ta machine seulement
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    ulimits:
      nofile: { soft: 131072, hard: 131072 }
      nproc: 8192


volumes:
  eventpro_db:
  jenkins_home:
    external: true
    name: jenkins_home
  sonarqube_db:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:

  # dans la section volumes :
  registry_data:


